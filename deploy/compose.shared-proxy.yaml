services:
  bot:
    networks:
      web:
        aliases: [ai-messanger-bot]
  agent-one:
    security_opt:
      - apparmor=ai-messanger-runner
    volumes:
      - /var/lib/ai-messanger-inventory:/vps-info:ro
  agent-two:
    security_opt:
      - apparmor=ai-messanger-runner
  caddy:
    profiles: [standalone-proxy]

networks:
  web:
    name: web
    external: true
