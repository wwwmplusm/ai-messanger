x-runner: &runner
  build:
    context: .
    target: runner
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true, seccomp:unconfined]
  pids_limit: 256

services:
  bot:
    build:
      context: .
      target: bot
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:?required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
      GROUP_SETUP_CODE: ${GROUP_SETUP_CODE:-}
      RUNNER_1_URL: http://agent-one:8081
      RUNNER_2_URL: http://agent-two:8081
      RUNNER_1_SECRET: ${RUNNER_1_SECRET:?required}
      RUNNER_2_SECRET: ${RUNNER_2_SECRET:?required}
    volumes: [bot-data:/data]
    networks: [web, agent-one, agent-two]
    depends_on: [agent-one, agent-two]

  agent-one:
    <<: *runner
    environment:
      DATA_DIR: /data
      RUNNER_SECRET: ${RUNNER_1_SECRET:?required}
    volumes: [agent-one-data:/data]
    networks: [agent-one]

  agent-two:
    <<: *runner
    environment:
      DATA_DIR: /data
      RUNNER_SECRET: ${RUNNER_2_SECRET:?required}
    volumes: [agent-two-data:/data]
    networks: [agent-two]

  caddy:
    image: caddy:2.10-alpine
    init: true
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    depends_on: [bot]

networks:
  web:
  agent-one:
  agent-two:

volumes:
  bot-data:
  agent-one-data:
  agent-two-data:
  caddy-data:
  caddy-config:
